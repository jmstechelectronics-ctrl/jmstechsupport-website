<!doctype html>
<html lang="en-AU">
<head>
  <script defer src="/assets/meta-lead-tracking.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Thanks | JMS Tech Support</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    :root{--primary:#006092;--primary-dark:#092d5e;--ink:#0b1020;--muted:#5b6475;--bg:#f6f8fb;--card:#fff;--line:#e6ebf2;--radius:18px}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:radial-gradient(900px 520px at 6% -10%,rgba(0,96,146,.16),transparent 60%),linear-gradient(180deg,#f7fafc 0%,#edf3f8 100%);color:var(--ink);line-height:1.6}
    main{width:min(100%,640px)}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(30px,7vw,64px);box-shadow:0 24px 70px rgba(11,16,32,.13);text-align:center}
    img{width:180px;height:auto;margin:0 auto 30px}
    h1{margin:0 0 12px;color:var(--primary-dark);font-size:clamp(30px,5vw,44px);line-height:1.12}
    p{margin:0 auto 26px;max-width:470px;color:var(--muted)}
    .btn{display:inline-block;background:var(--primary);color:#fff;padding:13px 20px;border-radius:10px;text-decoration:none;font-weight:800}
    .btn:hover{background:var(--primary-dark)}
  </style>
</head>
<body data-meta-lead="true">
  <main>
    <section class="panel" aria-labelledby="thanks-title">
      <img src="logo.png" width="811" height="445" alt="JMS Tech Support" />
      <h1 id="thanks-title">Thanks. Your request has been sent.</h1>
      <p>We will review the details and get back to you with a clear next step.</p>
      <a class="btn" href="/">Back to JMS Tech Support</a>
    </section>
  </main>
</body>
</html>
